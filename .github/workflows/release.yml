name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing Git tag to release (for example v0.6.1-alpha)"
        required: true
        type: string
      publish_pypi:
        description: "Also publish the Python distributions to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify-cross-platform:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run full Python release tests
        if: runner.os != 'Windows'
        run: uv run python scripts/run-release-tests.py

      - name: Run Windows Python release tests
        if: runner.os == 'Windows'
        run: >-
          uv run python -m unittest -v
          tests.test_acceptance
          tests.test_agent_apps.HostHelperTests
          tests.test_powershell_scripts
          tests.test_workflow_dsl
          tests.test_workflow_handler_registry

      - name: Run UI tests
        run: node --test tests/ui/client_modules.test.mjs

      - name: Test DeepSeek Harness Bundle
        working-directory: integrations/deepseek-harness
        run: |
          npm ci
          npm test
          npm run typecheck
          npm pack --dry-run

      - name: Validate POSIX launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n start-promptaflow.sh
          bash -n restart-promptaflow.sh
          bash -n stop-promptaflow.sh

      - name: Validate Windows PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "start-promptaflow.ps1",
            "restart-promptaflow.ps1",
            "stop-promptaflow.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $_" }
              exit 1
            }
          }

  release:
    needs: verify-cross-platform
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and verify release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          release_tag="$REQUESTED_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "unsupported release tag: $release_tag" >&2
            exit 2
          fi
          version="${release_tag#v}"
          package_version="$(python -c 'import ast; p=ast.parse(open("src/promptaflow/__init__.py").read()); print(next(n.value.value for n in p.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets)))')"
          test "$package_version" = "$version"
          integration_core_version="$(node -p "require('./integration-core/package.json').version")"
          test "$integration_core_version" = "$version"
          deepseek_harness_version="$(node -p "require('./integrations/deepseek-harness/package.json').version")"
          test "$deepseek_harness_version" = "$version"
          echo "PROMPTAFLOW_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PROMPTAFLOW_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: |
          uv run python scripts/run-release-tests.py
          node --test tests/ui/client_modules.test.mjs

      - name: Build Python packages
        run: uv build

      - name: Test and pack DeepSeek Harness Bundle
        working-directory: integrations/deepseek-harness
        run: |
          npm ci
          npm test
          npm run typecheck
          npm pack --pack-destination ../../dist

      - name: Build local Marketplace archive
        run: |
          uv run python scripts/build-marketplace-release.py \
            --version "$PROMPTAFLOW_RELEASE_VERSION" \
            --output "dist/promptaflow-marketplace-$PROMPTAFLOW_RELEASE_VERSION.zip" \
            --plugin-output "dist/promptaflow-plugin-$PROMPTAFLOW_RELEASE_VERSION.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PROMPTAFLOW_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$PROMPTAFLOW_RELEASE_TAG" dist/* --clobber
          else
            prerelease_flag=()
            if [[ "$PROMPTAFLOW_RELEASE_VERSION" == *-* ]]; then
              prerelease_flag=(--prerelease)
            fi
            gh release create "$PROMPTAFLOW_RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              "${prerelease_flag[@]}" \
              --title "PromptaFlow $PROMPTAFLOW_RELEASE_TAG"
          fi

      # Only the wheel and the sdist. By this point `dist/` also holds the npm
      # tarball and the Marketplace ZIP, and PyPI takes neither.
      - name: Collect the Python distributions
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          ls -l pypi-dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: pypi-dist/

  publish-pypi:
    # Separate job because trusted publishing wants a job whose only power is
    # to publish: it runs with `id-token: write` and nothing else, and it can
    # be gated on a GitHub Environment that requires a review.
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/promptaflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      # No API token anywhere: PyPI trusts this repository, workflow and
      # environment, and mints a short-lived credential for the upload.
      # Configure it once at https://pypi.org/manage/account/publishing/ .
      - uses: pypa/gh-action-pypi-publish@release/v1
